name: Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_fix:
    name: Fix styling
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Fix linting
      run: pnpm run lint:fix

    - name: Commit potential changes
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: Fix styling

  lint:
    name: Check styling
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check linting
      run: pnpm run lint

  tests:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18.x", "20.x"]

    steps:
    - name: Git checkout
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build and run tests
      run: pnpm build && pnpm test

  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [lint, tests]
    # OIDC trusted publishing to npm. `id-token: write` lets the job mint an
    # OIDC token that pnpm exchanges with npm for a short-lived publish token,
    # so no long-lived NPM_TOKEN secret is needed. `contents`/`pull-requests`
    # are what changesets/action needs to open the release PR and push tags.
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      # npm OIDC trusted publishing needs npm >= 11.5.1. `changeset publish`
      # runs `pnpm publish`, which shells out to the npm CLI to do the actual
      # publish and OIDC token exchange -- so it is npm's version that matters
      # here, not pnpm's. Node 22 ships npm 10.x, so upgrade explicitly.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          commit: "Release packages"
          title: "Release packages"
          publish: pnpm package:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN on purpose: changesets/action falls back to npm OIDC
          # trusted publishing when NPM_TOKEN is absent and id-token is granted.

  deploy_docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.outputs.published == 'true'
    environment:
      name: js-documentation
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: echo "url=$(vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }})" | tee $GITHUB_OUTPUT
